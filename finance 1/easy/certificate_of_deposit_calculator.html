<!DOCTYPE html>
<html>
<head>
  <title>Certificate of Deposit Calculator</title>
</head>
<body>
    <h1>Certificate of Deposit Calculator</h1>
    <h3>Calculate the fixed deposit interest and maturity amount.</h3>
    <p>
      Initial deposit:
      <input type="number" id="initDeposit">
    </p>
    <p>
      Months:
      <input type="number" id="months"> months
    </p>
    <p>
      Annual interest rate:
      <input type="number" id="intRate">%
    </p>
    <p>
      Compound:
      <select
        class="selects"
        id="freqSelect"
      >
        <option value="365">Daily</option>
        <option value="12">Monthly</option>
        <option value="4">Quarterly</option>
        <option value="2">Semi-Annually</option>
        <option value="1" selected>Annually</option>
      </select>
    </p>

    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const initDepositEl = document.getElementById("initDeposit");
      const monthsEl = document.getElementById("months");
      const goodsCostEl = document.getElementById("intRate");
      const freqSelectEl = document.getElementById("freqSelect");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Annual Percentage Yield (APY): &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>%
            </p>
            <p>
              <label for="i12-span">Total Interest Earned: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i13-span">Ending Balance: &nbsp;</label>
              <span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${val * 1}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const initDeposit = parseFloat(initDepositEl.value);
          const months = parseFloat(monthsEl.value);
          const intRate = parseFloat(goodsCostEl.value);
          const freqSelect = parseFloat(freqSelectEl.value);

          if (isNaN(initDeposit) || initDeposit <= 0 || isNaN(months) || months < 1 || isNaN(intRate) || intRate < 0.1
          ) {
            alert("Please Enter All Details.");
            return;
          } else if (intRate >= 100) {
            alert("Ensure this value is less than 100");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const year = months / 12
            const APY = (((1 + (intRate / 100 / freqSelect)) ** freqSelect) - 1) * 100
            const endingBal = initDeposit * ((1 + (intRate / 100 / freqSelect)) ** (freqSelect * year))
            const totalInt = endingBal - initDeposit

            const results = {
              1: { result: Math.abs(APY) > 1 ? APY.toFixed(3) : APY.toPrecision(3), type: "i11" },
              2: { result: Math.abs(totalInt) > 1 ? totalInt.toFixed(2) : totalInt.toPrecision(2), type: "i12" },
              3: { result: Math.abs(endingBal) > 1 ? endingBal.toFixed(2) : endingBal.toPrecision(2), type: "i13" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        initDepositEl.value = ""
        monthsEl.value = ""
        goodsCostEl.value = ""
        freqSelectEl.selectedIndex = "4"
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [initDepositEl, monthsEl, goodsCostEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  

      freqSelectEl.addEventListener("change", resetResult);

    </script>
</body>
</html>
