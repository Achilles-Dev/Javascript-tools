<!DOCTYPE html>
<html>
<head>
  <title>PITI Calculator</title>
</head>
<body>
    <h1>PITI Calculator</h1>
    <p>
      Principal:
      <input type="number" id="principal">
    </p>
    <p>
      Term: 
      <input type="number" id="term">
      <select id="termSelect">
        <option value="12">months</option>
        <option value="1" selected>years</option>
      </select>
    </p>
    <p>
      Interest rate:
      <input type="number" id="intRate">%
    </p>
    <p>
      Tax:
      <input type="number" id="tax">
    </p>  
    <p>
      Insurance:
      <input type="number" id="insurance">
    </p>


    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const principalEl = document.getElementById("principal");
      const termEl = document.getElementById("term");
      const intRateEl = document.getElementById("intRate");
      const insuranceEl = document.getElementById("insurance");
      const taxEl = document.getElementById("tax");
      const termSelectEl = document.getElementById("termSelect");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">PITI: &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span> / month
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${parseFloat(val)}`;
        }
      }


      function calculateResults() {
          // Retrieve input values
          const principal = parseFloat(principalEl.value);
          const intRate = parseFloat(intRateEl.value);
          const insurance = parseFloat(insuranceEl.value);
          const tax = parseFloat(taxEl.value)
          const termSelect = parseFloat(termSelectEl.value);
          const term = parseFloat(termEl.value) / termSelect;

          if (isNaN(principal) || principal < 0 || isNaN(term) || term < 0 || isNaN(intRate) || intRate <= 0 ||
            isNaN(insurance) || insurance < 0 || isNaN(tax) || tax < 0
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const monthlyPmt = (principal * ((intRate / 12) / 100) * ((1 + ((intRate / 12) / 100)) ** (term * 12))) / 
            ((1 + ((intRate / 12) / 100)) ** (term * 12) - 1)

            const PITI = monthlyPmt + insurance + tax

            const results = {
              1: { result: Math.abs(PITI) > 1 ? PITI.toFixed(2) : PITI.toPrecision(2), type: "i11" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        principalEl.value = ""
        termEl.value = ""
        intRateEl.value = ""
        insuranceEl.value = ""
        taxEl.value = ""
        termSelectEl.selectedIndex = "1"
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [principalEl, termEl, intRateEl, insuranceEl, taxEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  

      termSelectEl.addEventListener("change", resetResult)

    </script>
</body>
</html>
