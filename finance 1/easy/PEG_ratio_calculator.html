<!DOCTYPE html>
<html>
<head>
  <title>PEG Ratio Calculator</title>
</head>
<body>
    <h1>PEG Ratio Calculator</h1>
    <p>
      Price per share:
      <input type="number" id="priceShare">
    </p>
    <div id="ysInputs" style="display: none;" class="inputs">
      <p>
        Total earnings:
        <input type="number" id="totalEarns">
      </p>
      <p>
        Number of shares outstanding: 
        <input type="number" id="sharesOuts">
      </p>
    </div>
    <p id="noInput" class="inputs">
      Earnings per share (EPS): 
      <input type="number" id="eps">
    </p>
    <p>
      Calculate earnings per share:
      <select id="calcEpsSelect">
        <option value="ys">Yes</option>
        <option value="no" selected>No</option>
      </select>
    </p>
    <p>
      Retention rate:
      <input type="number" id="retentionRate">%
    </p>
    <p>
      Return on equity (ROE):
      <input type="number" id="roe">%
    </p>


    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const priceShareEl = document.getElementById("priceShare");
      const epsEl = document.getElementById("eps");
      const retentionRateEl = document.getElementById("retentionRate");
      const roeEl = document.getElementById("roe");
      const totalEarnsEl = document.getElementById("totalEarns");
      const sharesOutsEl = document.getElementById("sharesOuts");
      const calcEpsSelectEl = document.getElementById("calcEpsSelect");
      const inputsEl = document.querySelectorAll(".inputs");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function handleCalcEpsSelectChange(e) {
        const value = e.target.value

        inputsEl.forEach((input) => {
          const idVal = input.id.slice(0,2)
          if (idVal === value) {
            input.style.display = "block"
          } else {
            input.style.display = "none"
          }
        })

        resetResult()
      }

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">P/E ratio: &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>x
            </p>
            <p>
              <label for="i12-span">Earnings growth: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>%
            </p>
            <p>
              <label for="i13-span">PEG ratio: &nbsp;</label>
              <span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>x
            </p>
        `
        const newDiv2 = `
            <p>
              <label for="i14-span">Earnings per share (EPS): &nbsp;</label>
              <span
                data-id="i14"
                step="any"
                id="i14-span"
                class="spans"
              ></span>
            </p>
        `
        if (calcEpsSelectEl.value === "ys") {
          return newDiv2 + newDiv
        }
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${parseFloat(val)}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const priceShare = parseFloat(priceShareEl.value);
          const eps = parseFloat(epsEl.value);
          const retentionRate = parseFloat(retentionRateEl.value);
          const totalEarns = parseFloat(totalEarnsEl.value);
          const sharesOuts = parseFloat(sharesOutsEl.value);
          const roe = parseFloat(roeEl.value);
          const calcEpsSelect = calcEpsSelectEl.value

          if (isNaN(priceShare) || priceShare <= 0 || (calcEpsSelect === "no" && (isNaN(eps) || eps < 0)) || 
            isNaN(retentionRate) || retentionRate < 0 || isNaN(roe) || roe < 0 || 
            (calcEpsSelect === "no" && (isNaN(totalEarns) || totalEarns < 1 || isNaN(sharesOuts) || sharesOuts <= 0))
          ) {
            alert("Please Enter All Details.");
            return;
          } else if (retentionRate > 100) {
            alert("Retention rate should not be more than 100%.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            let results = {}
            let EPSRatio = 0
            
            if (calcEpsSelect === "ys") {
              const EPSValue = totalEarns / sharesOuts
              console.log(EPSValue)
              EPSRatio =  priceShare / EPSValue
              results = {
                4: { result: Math.abs(EPSValue) > 1 ? EPSValue.toFixed(2) : EPSValue.toPrecision(2), type: "i14" },
              }
            } else {
              EPSRatio = priceShare / eps
            }
            const EGrowth = (retentionRate * roe) / 100
            const PEGRatio = EPSRatio / EGrowth

            results = {
              ...results,
              1: { result: Math.abs(EPSRatio) > 1 ? EPSRatio.toFixed(4) : EPSRatio.toPrecision(4), type: "i11" },
              2: { result: Math.abs(EGrowth) > 1 ? EGrowth.toFixed(2) : EGrowth.toPrecision(2), type: "i12" },
              3: { result: Math.abs(PEGRatio) > 1 ? PEGRatio.toFixed(4) : PEGRatio.toPrecision(5), type: "i13" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        priceShareEl.value = ""
        epsEl.value = ""
        retentionRateEl.value = ""
        roeEl.value = ""
        totalEarnsEl.value = ""
        sharesOutsEl.value = ""
        calcEpsSelectEl.selectedIndex = "1"
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [priceShareEl, epsEl, retentionRateEl, roeEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  

      calcEpsSelectEl.addEventListener("change", handleCalcEpsSelectChange);

    </script>
</body>
</html>
