<!DOCTYPE html>
<html>
<head>
  <title>Net to Gross Calculator</title>
</head>
<body>
    <h1>Net to Gross Calculator</h1>
    <p>
      Net amount:
      <input type="number" id="netAmt">
    </p>
    <p>
      Percentage tax (from net):
      <input type="number" id="percentTax">%
    </p>

    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const netAmtEl = document.getElementById("netAmt");
      const percentTaxEl = document.getElementById("percentTax");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Percentage tax (from gross): &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>%
            </p>
            <p>
              <label for="i12-span">Gross amount: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i13-span">Tax amount: &nbsp;</label>
              <span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${parseFloat(val)}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const netAmt = parseFloat(netAmtEl.value);
          const percentTax = parseFloat(percentTaxEl.value);

          if (isNaN(netAmt)  || netAmt <= 0 || isNaN(percentTax) || percentTax <= 0
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const netTax = (netAmt * (percentTax  / 100))
            const GPA = netAmt + netTax
            const GPT = (netTax / GPA) * 100

            const results = {
              1: { result: Math.abs(GPT) > 1 ? GPT.toFixed(5) : GPT.toPrecision(5), type: "i11" },
              2: { result: Math.abs(GPA) > 1 ? GPA.toFixed(2) : GPA.toPrecision(2), type: "i12" },
              3: { result: Math.abs(netTax) > 1 ? netTax.toFixed(2) : netTax.toPrecision(2), type: "i13" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        netAmtEl.value = ""
        percentTaxEl.value = ""
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);

      [netAmtEl, percentTaxEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  
    </script>
</body>
</html>
