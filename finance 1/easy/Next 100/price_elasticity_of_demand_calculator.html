<!DOCTYPE html>
<html>
<head>
  <title>Price Elasticity of Demand Calculator</title>
</head>
<body>
    <h1>Price Elasticity of Demand Calculator</h1>
    <p>
      Initial price:
      <input type="number" id="initPrice">
    </p>
    <p>
      Initial quantity:
      <input type="number" id="initQuantity">
    </p>
    <p>
      Final price:
      <input type="number" id="finalPrice">
    </p>
    <p>
      Final quantity:
      <input type="number" id="finalQuantity">
    </p>

    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const initPriceEl = document.getElementById("initPrice");
      const initQuantityEl = document.getElementById("initQuantity");
      const finalPriceEl = document.getElementById("finalPrice");
      const finalQuantityEl = document.getElementById("finalQuantity");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i111-span">Price elasticity of demand: &nbsp;</label>
              <span
                data-id="i111"
                step="any"
                id="i111-span"
                class="spans"
              ></span> 
            </p>
            <p>
              <span
                data-id="i112"
                step="any"
                id="i112-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i12-span">Initial revenue: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i13-span">Final revenue: &nbsp;</label>
              <span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i14-span">Revenue increase: &nbsp;</label>
              <span
                data-id="i14"
                step="any"
                id="i14-span"
                class="spans"
              ></span>%
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (id === "i112") {
            const span = document.getElementById(`${id}-span`);
            span.textContent = val;
          } else {
            if (isNaN(val)) {
              alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
              return;
            }
            if (Math.abs(val) === Infinity) {
              alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
              return;
            }
            const span = document.getElementById(`${id}-span`);
            span.textContent = `${parseFloat(val)}`;
          }
        }
      }

      function calculateResults() {
          // Retrieve input values
          const initPrice = parseFloat(initPriceEl.value);
          const initQuantity = parseFloat(initQuantityEl.value);
          const finalPrice = parseFloat(finalPriceEl.value);
          const finalQuantity = parseFloat(finalQuantityEl.value);

          if (isNaN(initPrice)  || initPrice <= 0 || isNaN(initQuantity) || initQuantity <= 0 ||
            isNaN(finalPrice) || finalPrice <= 0 || isNaN(finalQuantity) || finalQuantity <= 0
          ) {
            alert("Please Enter All Details.");
            return;
          } else if ((initPrice > finalPrice && initQuantity > finalQuantity) || 
            (initPrice < finalPrice && initQuantity < finalQuantity)
          ) {
            alert("If price decreases, quantity must increase (and vice versa).");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const PED = ((finalQuantity - initQuantity) / ((finalQuantity + initQuantity) / 2)) /
                ((finalPrice - initPrice) / ((finalPrice + initPrice) / 2))
            const initRevenue = initPrice * initQuantity
            const finalRevenue = finalPrice * finalQuantity
            const revenueIncrease = ((finalRevenue - initRevenue) / initRevenue) * 100
            let elasticity = ""
            if (Math.abs(PED) === 0) {
              elasticity = "Elasticity: Perfectly inelastic"
            } else if (Math.abs(PED) < 1) {
              elasticity = "Elasticity: Inelastic"
            } else if (Math.abs(PED) > 1) {
              elasticity = "Elasticity: Elastic"
            } else if (Math.abs(PED) === 1) {
              elasticity = "Elasticity: Unitary elastic"
            }

            const results = {
              1: { result: Math.abs(PED) > 1 ? PED.toFixed(4) : PED.toPrecision(5), type: "i111" },
              2: { result: elasticity, type: "i112" },
              3: { result: Math.abs(initRevenue) > 1 ? initRevenue.toFixed(2) : initRevenue.toPrecision(2), type: "i12" },
              4: { result: Math.abs(finalRevenue) > 1 ? finalRevenue.toFixed(2) : finalRevenue.toPrecision(2), type: "i13" },
              5: { result: Math.abs(revenueIncrease) > 1 ? revenueIncrease.toFixed(2) : revenueIncrease.toPrecision(2), type: "i14" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        initPriceEl.value = ""
        initQuantityEl.value = ""
        finalPriceEl.value = ""
        finalQuantityEl.value = ""
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);

      [initPriceEl, initQuantityEl, finalPriceEl, finalQuantityEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  
    </script>
</body>
</html>
