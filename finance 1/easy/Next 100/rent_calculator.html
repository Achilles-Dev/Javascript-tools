<!DOCTYPE html>
<html>
<head>
  <title>Rent Calculator</title>
</head>
<body>
    <h1>Rent Calculator</h1>
    <p>
      Monthly income:
      <input type="number" id="monthIncome">
    </p>
    <p>
      Monthly savings: 
      <input type="number" id="monthSavings">
    </p>
    <p>
      Monthly debt payments:
      <input type="number" id="debtPayment">
    </p>
    <p>
      Monthly expenses:
      <input type="number" id="monthExpense">
    <p>
      Monthly rent:
      <input type="number" id="monthRent">
    </p>


    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const monthIncomeEl = document.getElementById("monthIncome");
      const monthSavingsEl = document.getElementById("monthSavings");
      const debtPaymentEl = document.getElementById("debtPayment");
      const monthRentEl = document.getElementById("monthRent");
      const monthExpenseEl = document.getElementById("monthExpense");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Affordable rent: &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i12-span">Rent-to-income ratio: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>%
            </p>
            <p>
              <label for="i13-span">Required annual gross income: &nbsp;</label>
              <span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${parseFloat(val)}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const monthIncome = parseFloat(monthIncomeEl.value);
          const monthSavings = parseFloat(monthSavingsEl.value);
          const debtPayment = parseFloat(debtPaymentEl.value);
          const monthRent = parseFloat(monthRentEl.value);
          const monthExpense = parseFloat(monthExpenseEl.value)

          if (isNaN(monthIncome) || monthIncome < 0 || isNaN(monthSavings) || monthSavings < 0 || isNaN(debtPayment) || 
            debtPayment < 0 || isNaN(monthRent) || monthRent <= 0 || isNaN(monthExpense) || monthExpense <= 0 
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const AFRT = monthIncome - (monthSavings + debtPayment + monthExpense)
            const RTI = (monthRent / monthIncome) * 100
            const RAGI = monthRent * 40

            const results = {
              1: { result: Math.abs(AFRT) > 1 ? AFRT.toFixed(2) : AFRT.toPrecision(2), type: "i11" },
              2: { result: Math.abs(RTI) > 1 ? RTI.toFixed(2) : RTI.toPrecision(2), type: "i12" },
              3: { result: Math.abs(RAGI) > 1 ? RAGI.toFixed(2) : RAGI.toPrecision(2), type: "i13" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        monthIncomeEl.value = ""
        monthSavingsEl.value = ""
        debtPaymentEl.value = ""
        monthRentEl.value = ""
        monthExpenseEl.value = ""
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [monthIncomeEl, monthSavingsEl, debtPaymentEl, monthRentEl, monthExpenseEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  


    </script>
</body>
</html>
