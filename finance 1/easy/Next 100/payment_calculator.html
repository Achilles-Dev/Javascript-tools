<!DOCTYPE html>
<html>
<head>
  <title>Payment Calculator</title>
</head>
<body>
    <h1>Payment Calculator</h1>
    <h3>Calculate Loan-to-Value Ratio</h3>
    <p>
      Calculate for:
      <select id="calculateSelect">
        <option value="trm" selected>Fixed Term</option>
        <option value="pmt">Fixed Payments</option>
      </select>
    </p>
    <p>
      Loan Amount:
      <input type="number" id="loanAmt" value="200000">
    </p>
    <p id="trmInputs" class="inputs">
      Loan Term: 
      <input type="number" id="loanTerm" value="15"> years
    </p>
    <p id="pmtInputs" class="inputs" style="display: none;">
      Monthly Pay:
      <input type="number" id="monthPay" value="2000">
    </p>
    <p>
      Interest Rate:
      <input type="number" id="intRate" value="6">%
    </p>

    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const calculateSelectEl = document.getElementById("calculateSelect");
      const loanAmtEl = document.getElementById("loanAmt");
      const loanTermEl = document.getElementById("loanTerm");
      const monthPayEl = document.getElementById("monthPay");
      const intRateEl = document.getElementById("intRate");
      const inputsEl = document.querySelectorAll(".inputs");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function handleCalculateSelectChange(e) {
        const value = e.target.value

        inputsEl.forEach((input) => {
          const idVal = input.id.slice(0, 3)
          if (idVal === value) {
            input.style.display = "block"
          } else {
            input.style.display = "none"
          }
        })

        resetResult()
      }

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Total Payments : &nbsp;</label>
              $<span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i12-span">Total Interest: &nbsp;</label>
              $<span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
        `
        const newDiv2 = `
            <p>
              <label for="i13-span">Monthly Payment: &nbsp;</label>
              $<span
                data-id="i13"
                step="any"
                id="i13-span"
                class="spans"
              ></span>
            </p>
        `
        const newDiv3 = `
            <p>
              <label for="i14-span">Time Required to Clear Debt: &nbsp;</label>
              <span
                data-id="i14"
                step="any"
                id="i14-span"
                class="spans"
              ></span> years
            </p>
        `
        if (calculateSelectEl.value === "pmt") {
          return newDiv3 + newDiv
        }
        return newDiv2 + newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${parseFloat(val)}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const loanAmt = parseFloat(loanAmtEl.value);
          const loanTerm = parseFloat(loanTermEl.value);
          const monthPay = parseFloat(monthPayEl.value);
          const intRate = parseFloat(intRateEl.value)
          const calculateSelect = calculateSelectEl.value

          if ((calculateSelect === "pmt" && (isNaN(monthPay) || monthPay <= 0 )) || 
            (calculateSelect === "trm" && (isNaN(loanTerm) || loanTerm <= 0)) ||
            isNaN(loanAmt) || loanAmt <= 0 || isNaN(intRate) || intRate <= 0
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            let results = {}

            if (calculateSelect === "trm") {
              const monthlyPmt = (loanAmt * ((intRate / 12) / 100) * ((1 + ((intRate / 12) / 100)) ** (loanTerm * 12))) / 
                  ((1 + ((intRate / 12) / 100)) ** (loanTerm * 12) - 1)
              const totalPmts = (monthlyPmt * (loanTerm * 12))
              const totalInt = totalPmts - loanAmt

              results = {
                1: { result: Math.abs(totalPmts) > 1 ? totalPmts.toFixed(2) : totalPmts.toPrecision(2), type: "i11" },
                2: { result: Math.abs(totalInt) > 1 ? totalInt.toFixed(2) : totalInt.toPrecision(2), type: "i12" },
                3: { result: Math.abs(monthlyPmt) > 1 ? monthlyPmt.toFixed(2) : monthlyPmt.toPrecision(2), type: "i13" },
              }
            } else {
              const fixedTerm = (Math.log((monthPay / (monthPay - (loanAmt * ((intRate / 12) / 100))))) / 
                Math.log((1 + ((intRate / 12) / 100)))) / 12
              const totalPmts = (monthPay * (fixedTerm * 12))
              const totalInt = totalPmts - loanAmt

              results = {
                1: { result: Math.abs(totalPmts) > 1 ? totalPmts.toFixed(2) : totalPmts.toPrecision(2), type: "i11" },
                2: { result: Math.abs(totalInt) > 1 ? totalInt.toFixed(2) : totalInt.toPrecision(2), type: "i12" },
                3: { result: Math.abs(fixedTerm) > 1 ? fixedTerm.toFixed(2) : fixedTerm.toPrecision(2), type: "i14" },
              }
            }
             
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        loanAmtEl.value = "200000"
        loanTermEl.value = "15"
        monthPayEl.value = "2000"
        intRateEl.value = "6"
        calculateSelectEl.selectedIndex = "0"

        inputsEl.forEach((input) => {
          const idVal = input.id.slice(0, 3)
          if (idVal === "trm") {
            input.style.display = "block"
          } else {
            input.style.display = "none"
          }
        })
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [loanAmtEl, loanTermEl, monthPayEl, intRateEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      });  

      calculateSelectEl.addEventListener("change", handleCalculateSelectChange);

    </script>
</body>
</html>
