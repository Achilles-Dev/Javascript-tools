<!DOCTYPE html>
<html>
<head>
  <title>Capital Gains Tax UK Calculator</title>
</head>
<body>
    <h1>Capital Gains Tax UK Calculator</h1>
    <p>
      Tax year:
      <select id="yearSelect">
        <option value="2324" selected>2023/24</option>
        <option value="2223">2022/23</option>
      </select>
    </p>
    <p>
      Capital gains:
      <input type="number" id="capGains">
    </p>
    <p>
      Asset type:
      <select id="typeSelect">
        <option value="shares" selected>Shares</option>
        <option value="property">Property</option>
        <option value="crypto">Crypto</option>
        <option value="other">Other</option>
      </select>
    </p>
    <p>
      Are the assets in a trust?:
      <select id="inTrustSelect">
        <option value="no" selected>No</option>
        <option value="yes">Yes</option>
      </select>
    </p>
    <p>
      Annual income: 
      <input type="number" id="annualIncome">
    </p>
    <p>
      Other income:
      <input type="number" id="otherIncome" value="0">
    </p>

    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const capGainsEl = document.getElementById("capGains");
      const annualIncomeEl = document.getElementById("annualIncome");
      const otherIncomeEl = document.getElementById("otherIncome");
      const yearSelectEl = document.getElementById("yearSelect");
      const typeSelectEl = document.getElementById("typeSelect");
      const inTrustSelectEl = document.getElementById("inTrustSelect");

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Total annual income: &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i12-span">Capital gains tax: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${val}`
        }
      }

      function calculateResults() {
          // Retrieve input values
          const capGains = parseFloat(capGainsEl.value);
          const annualIncome = parseFloat(annualIncomeEl.value);
          const otherIncome = parseFloat(otherIncomeEl.value);
          const yearSelect = yearSelectEl.value;
          const typeSelect = typeSelectEl.value;
          const inTrustSelect = inTrustSelectEl.value;

          if (isNaN(capGains) || capGains < 0 || isNaN(annualIncome) || annualIncome < 0 || 
            isNaN(otherIncome) || otherIncome < 0
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const totalIncome = 0
            const capGainTax = 0

            const results = {
              1: { result: Math.abs(totalIncome) > 1 ? totalIncome.toFixed(2) : totalIncome.toPrecision(2), type: "i11" },
              2: { result: Math.abs(capGainTax) > 1 ? capGainTax.toFixed(2) : capGainTax.toPrecision(2), type: "i12" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        capGainsEl.value = ""
        annualIncomeEl.value = ""
        otherIncomeEl.value = ""
        yearSelectEl.selectedIndex = "0"
        typeSelectEl.selectedIndex = "0"
        inTrustSelectEl.selectedIndex = "0"
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [capGainsEl, annualIncomeEl, otherIncomeEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      }); 
      
      [typeSelectEl, inTrustSelectEl, yearSelectEl].forEach((el) => {
        el.addEventListener("change", resetResult);
      }); 

    </script>
</body>
</html>
