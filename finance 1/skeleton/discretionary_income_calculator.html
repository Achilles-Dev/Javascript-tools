<!DOCTYPE html>
<html>
<head>
  <title>Discretionary Income Calculator</title>
</head>
<body>
    <h1>Discretionary Income Calculator</h1>
    <p>
      Marital status:
      <select id="statusSelect">
        <option value="single">Single</option>
        <option value="marjoin">Married filed jointly</option>
        <option value="marsep">Married filed separately</option>
      </select>
    </p>
    <p>
      State: 
      <select name="states" id="statesSelect">
        <option value="">Select a state</option>
        <option value="AL">Alabama</option>
        <option value="AK">Alaska</option>
        <option value="AZ">Arizona</option>
        <option value="AR">Arkansas</option>
        <option value="CA">California</option>
        <option value="CO">Colorado</option>
        <option value="CT">Connecticut</option>
        <option value="DE">Delaware</option>
        <option value="FL">Florida</option>
        <option value="GA">Georgia</option>
        <option value="HI">Hawaii</option>
        <option value="ID">Idaho</option>
        <option value="IL">Illinois</option>
        <option value="IN">Indiana</option>
        <option value="IA">Iowa</option>
        <option value="KS">Kansas</option>
        <option value="KY">Kentucky</option>
        <option value="LA">Louisiana</option>
        <option value="ME">Maine</option>
        <option value="MD">Maryland</option>
        <option value="MA">Massachusetts</option>
        <option value="MI">Michigan</option>
        <option value="MN">Minnesota</option>
        <option value="MS">Mississippi</option>
        <option value="MO">Missouri</option>
        <option value="MT">Montana</option>
        <option value="NE">Nebraska</option>
        <option value="NV">Nevada</option>
        <option value="NH">New Hampshire</option>
        <option value="NJ">New Jersey</option>
        <option value="NM">New Mexico</option>
        <option value="NY">New York</option>
        <option value="NC">North Carolina</option>
        <option value="ND">North Dakota</option>
        <option value="OH">Ohio</option>
        <option value="OK">Oklahoma</option>
        <option value="OR">Oregon</option>
        <option value="PA">Pennsylvania</option>
        <option value="RI">Rhode Island</option>
        <option value="SC">South Carolina</option>
        <option value="SD">South Dakota</option>
        <option value="TN">Tennessee</option>
        <option value="TX">Texas</option>
        <option value="UT">Utah</option>
        <option value="VT">Vermont</option>
        <option value="VA">Virginia</option>
        <option value="WA">Washington</option>
        <option value="WV">West Virginia</option>
        <option value="WI">Wisconsin</option>
        <option value="WY">Wyoming</option>
      </select>
    </p>
    <p>
      Annual Adjusted Gross Income:
      <input type="number" id="grossIncome">
    </p>
    <p id="spouseInput" style="display: none;">
      Spouse's Adjusted Gross Income:
      <input type="number" id="spAdjIncome">
    </p>
    <p>
      Number of dependents:
      <input type="number" id="dependents">
    </p>
    
    <button id="calcBtn">Calculate</button>
    <button id="resetBtn">Reset</button>
    <hr>
    <div>
      <h3>Result:</h3>
      <h3 id="calcResults">Result will appear here...</h3>
    </div>

    <script>
      // Get required elements from the HTML
      const statusSelectEl = document.getElementById("statusSelect");
      const statesSelectEl = document.getElementById("statesSelect");
      const grossIncomeEl = document.getElementById("grossIncome");
      const dependentsEl = document.getElementById("dependents");
      const spAdjIncomeEl = document.getElementById("spAdjIncome")
      const spouseInputEl = document.getElementById("spouseInput")

      const calcBtnEl = document.getElementById('calcBtn');
      const resetBtnEl = document.getElementById('resetBtn');
      const calcResultsEl = document.getElementById('calcResults') 

      function handleStatusSelectChange(e) {
        const value = e.target.value

        spouseInputEl.style.display = statusSelectEl.value !== "single" ? "block" : "none"

        resetResult()
      }

      function createElement() {
        const newDiv = `
            <p>
              <label for="i11-span">Your annual discretionary income, based on the HHS Poverty Guidelines for 2024, is: &nbsp;</label>
              <span
                data-id="i11"
                step="any"
                id="i11-span"
                class="spans"
              ></span>
            </p>
            <p>
              <label for="i12-span">Your annual discretionary income, with the Income-Contingent Repayment (ICR) Formula, is: &nbsp;</label>
              <span
                data-id="i12"
                step="any"
                id="i12-span"
                class="spans"
              ></span>
            </p>
        `
        const newDiv2 = `
            <p>
              <span>
                Your Annual Adjusted Gross Income must be higher for the calculator to work with the given number of dependents. 
              </span> 
            </p>
        `
        return newDiv
      }

      function setResult(resultObj) {
        for (key of Object.keys(resultObj)) {
          let val = resultObj[key].result;
          let id = resultObj[key].type;

          if (isNaN(val)) {
           alert("Your input resulted in NAN.\n 0/0 \n Try again with valid input.");
            return;
          }
          if (Math.abs(val) === Infinity) {
            alert("Your input resulted in Infinity. \nDivision by zero. \nTry again with valid input.");
            return;
          }
          const span = document.getElementById(`${id}-span`);
          span.textContent = `${val}`;
        }
      }

      function calculateResults() {
          // Retrieve input values
          const statusSelect = statusSelectEl.value;
          const statesSelect = statesSelectEl.value;
          const grossIncome = parseFloat(grossIncomeEl.value);
          const dependents = parseFloat(dependentsEl.value);
          const spAdjIncome = parseFloat(spAdjIncomeEl.value);

          if (isNaN(grossIncome) || grossIncome < 0 || isNaN(dependents) || dependents <= 0 || 
            (statusSelect !== "single" && ((isNaN(spAdjIncome) || spAdjIncome < 0)))
          ) {
            alert("Please Enter All Details.");
            return;
          }

          try {
            const resultElement = createElement()
            calcResultsEl.innerHTML = resultElement 

            const HHSPG = 0
            const ICR = 0

            const results = {
              1: { result: Math.abs(HHSPG) > 1 ? HHSPG.toFixed(2) : HHSPG.toPrecision(2), type: "i11" },
              2: { result: Math.abs(ICR) > 1 ? ICR.toFixed(2) : ICR.toPrecision(2), type: "i12" },
            }
            setResult(results)

          } catch (error) {
            alert("Something Went Wrong!!!");
            resetResult()
            return;
          }
      }

      function resetForm() {
        statusSelectEl.selectedIndex = "0"
        statesSelectEl.selectedIndex = "0"
        spouseInputEl.style.display = "none"

        grossIncomeEl.value = ""
        dependentsEl.value = ""
        spAdjIncomeEl.value = ""
      }

      function resetResult() {
        calcResultsEl.innerHTML = "<p>Result will appear here...</p>";
      } 

      function resethandler() {
        resetForm();
        resetResult();
      }

      resetBtnEl.addEventListener("click", resethandler);
      calcBtnEl.addEventListener("click", calculateResults);
      [grossIncomeEl, dependentsEl, spAdjIncomeEl].forEach((el) => {
        el.addEventListener("input", resetResult);
      }); 
      
      statesSelectEl.addEventListener("change", resetResult);
      statusSelectEl.addEventListener("change", handleStatusSelectChange)
    </script>
</body>
</html>
