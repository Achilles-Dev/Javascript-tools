<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Intake Calculator</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.5/dist/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.5/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <h1>Protein Intake Calculator</h1>

    <div>
        <p>
            <label for="age">Age (in years):</label>
            <input type="number" id="age" name="age">
        </p>

        <p>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </p>

        <p>
            <label for="height">Height:</label>
            <input type="number" id="height" name="height">
            <select id="heightUnit" name="heightUnit">
                <option value="cm">cm</option>
                <option value="inches">inches</option>
            </select>
        </p>

        <p>
            <label for="weight">Weight:</label>
            <input type="number" id="weight" name="weight">
            <select id="weightUnit" name="weightUnit">
                <option value="kg">kg</option>
                <option value="lbs">lbs</option>
            </select>
        </p>

        <p>
            <label for="activity">Activity level:</label>
            <select class="form-select" name="activity" id="activity">
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light" selected="selected">Light (exercise 1-3 times a week)</option>
                <option value="moderate">Moderate (exercise 3-5 times a week)</option>
                <option value="high">heavy physical exercise 5-6 times per week</option>
                <option value="extreme">High (heavy exercise 6-7 times a week)</option>
            </select>
        </p>

        <p>
            <label for="nutrition_goal">Nutrition goal:</label>
            <select name="nutrition_goal" id="nutrition_goal">
                <option value="a" selected="selected">Maintain current weight</option>
                <option value="b">Mild weight loss, goal: ½ lb (¼ kg) per week</option>
                <option value="c">Moderate weight loss, goal: 1 lb (½ kg) per week</option>
                <option value="d">Heavy weight loss, goal: 2 lb (1 kg) per week</option>
                <option value="e">Build muscle or gain weight</option>
            </select>
        </p>
    
        <button id="calculate" class="page-button">Calculate</button>&nbsp;&nbsp;&nbsp;
        <button id="reset" class="page-button white">Reset</button>

        <hr>

        <p id="result">
            Results will appear here
        </p>

    <script>
        const ageEl = document.getElementById('age');
        const genderEl = document.getElementById('gender');
        const heightEl = document.getElementById('height');
        const heightUnitEl = document.getElementById('heightUnit');
        const weightEl = document.getElementById('weight');
        const weightUnitEl = document.getElementById('weightUnit');
        const activityEl = document.getElementById('activity');
        const nutritionGoalEl = document.getElementById('nutrition_goal');
        const resetEl = document.getElementById('reset');
        const resultEl = document.getElementById('result');
        const calculateEl = document.getElementById('calculate');

        function calculate() {
            const age = Number(ageEl.value);
            const gender = genderEl.value;
            let height = Number(heightEl.value);
            const heightUnit = heightUnitEl.value;
            let weight = Number(weightEl.value);
            const weightUnit = weightUnitEl.value;
            const activity = activityEl.value;
            const nutritionGoal = nutritionGoalEl.value;

            if (isNaN(age) || age <= 0 || isNaN(weight) || weight <= 0 || isNaN(height) || height <= 0) {
                showError("Please enter all inputs correctly");
                return;
            } else if (age < 18 || age > 80) {
                showError("Age should be between 18 and 80");
                return;
            }

            // Convert units
            if (heightUnit === 'inches') {
                height = height * 2.54; // convert inches to cm
            }

            if (weightUnit === 'lbs') {
                weight = weight * 0.453592; // convert lbs to kg
            }

            // Calculate TDEE (Total Daily Energy Expenditure)
            const bmr = (gender === 'male') ? 
                (10 * weight) + (6.25 * height) - (5 * age) + 5 : 
                (10 * weight) + (6.25 * height) - (5 * age) - 161;

            const activityMultiplier = {
                sedentary: 1.2,
                light: 1.375,
                moderate: 1.55,
                high: 1.725,
                extreme: 1.9
            }[activity];

            const tdee = bmr * activityMultiplier;

            // Calculate protein needs
            const proteinCaloriesPercentage = {
                a: 0.25, // Maintain weight
                b: 0.30, // Mild weight loss
                c: 0.35, // Moderate weight loss
                d: 0.40, // Heavy weight loss
                e: 0.30  // Build muscle or gain weight
            }[nutritionGoal];

            const academyProteinPerKilo = {
                sedentary: {
                    low: 0.8,
                    high: 1
                },
                light: {
                    low: 0.8,
                    high: 1
                },
                moderate: {
                    low: 1.2,
                    high: 1.4  
                },
                high: {
                    low: 1.2,
                    high: 1.4
                },
                extreme: {
                    low: 1.2,
                    high: 1.4
                },
            }[activity];

            const strengthFactor = {
                sedentary: 1,
                light: 1,
                moderate: 1.4,
                high: 1.4,
                extreme: 1.4
            }[activity]

            const natAcademyNutritionalFactor = {
                a: {
                    low: 0.025,
                    high: 0.0875
                },
                b: {
                    low: 0.02235,
                    high: 0.0787
                },
                c: {
                    low: 0.0199,
                    high: 0.06996 
                },
                d: {
                    low: 0.0151,
                    high: 0.0525
                },
                e: {
                    low: 0.0311,
                    high: 0.109
                },
            }[nutritionGoal]

            const calorieAllowanceFactor = {
                a: 1, // Maintain weight
                b: 0.9, // Mild weight loss
                c: 0.8, // Moderate weight loss
                d: 0.7, // Heavy weight loss
                e: 0.6  // Build muscle or gain weight
            }[nutritionGoal]
            

            const proteinCalories = tdee * proteinCaloriesPercentage;
            const proteinGramsFromCalories = proteinCalories / 4;

            // Calculate dynamic recommendations
            const nasMin = (natAcademyNutritionalFactor.low * tdee).toFixed(0); // Minimum intake
            const nasMax = (natAcademyNutritionalFactor.high * tdee).toFixed(0); // Upper limit for NAS

            const dietMin = (academyProteinPerKilo.low * weight).toFixed(0); // Lower bound for athletes
            const dietMax = (academyProteinPerKilo.high * weight).toFixed(0); // Upper bound for athletes

            const strengthMin = (strengthFactor * weight).toFixed(0); // Strength training lower bound
            const strengthMax = (1.7 * weight).toFixed(0); // Strength training upper bound

            resultEl.innerHTML = `
                <h2>Optimal Protein Intake</h2>
                <b>National Academy of Sciences Recommendation:</b> ${nasMin} - ${nasMax} grams/day<br>
                <b>10-35% of a</b> ${(tdee * calorieAllowanceFactor).toFixed()} <b>daily calorie allowance</b> <br>
                <b>Academy of Nutrition and Dietetics Recommendation:</b> ${dietMin} - ${dietMax} grams/day<br>
                <b>Optimal Intake for Weightlifting & Strength Training:</b> ${strengthMin} - ${strengthMax} grams/day<br>
            `;
        }

        function showError(errorMessage) {
            Swal.fire({
                icon: "error",
                title: "Error",
                text: errorMessage,
            });
        }

        function resetForm() {
            genderEl.selectedIndex = 0;
            ageEl.value = '';
            heightEl.value = '';
            heightUnitEl.selectedIndex = 0;
            weightEl.value = '';
            weightUnitEl.selectedIndex = 0;
            activityEl.selectedIndex = 1;
            nutritionGoalEl.selectedIndex = 0;
            resultEl.innerHTML = "<p> Results will appear here </p>";
        }

        function resetHandler() {
            resetForm();
        }

        calculateEl.addEventListener("click", calculate);
        resetEl.addEventListener("click", resetHandler);
    </script>
</body>
</html>
